# docker-compose.yml — Transducin unified stack (lumen / dev)
#
# Incluye:
#   transducin-api     — REST API (puerto 8004)
#   transducin-watcher — Hot-folder watcher (sin puerto expuesto)
#   orthanc            — PACS local (puertos 4242 DICOM-C-STORE, 8042 HTTP)
#
# Uso:
#   cp .env.example .env   # editar ORTHANC_HTTP_PASS, GRAEFE_WEBHOOK_URL, etc.
#   docker compose up -d
#
# Para Synology Container Manager ver deploy/docker-compose.yml

services:
  orthanc:
    image: orthancteam/orthanc:24.6.0
    container_name: transducin-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"   # DICOM C-STORE / C-FIND
      - "8042:8042"   # HTTP REST API
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./deploy/orthanc.json:/etc/orthanc/orthanc.json:ro
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"orthanc": "${ORTHANC_HTTP_PASS:-orthanc}"}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "orthanc:${ORTHANC_HTTP_PASS:-orthanc}",
             "http://localhost:8042/system"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  transducin-api:
    image: transducin:${TRANSDUCIN_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: transducin-api
    restart: unless-stopped
    ports:
      - "${TRANSDUCIN_API_PORT:-8004}:8004"
    env_file: .env
    environment:
      ORTHANC_HTTP_HOST: orthanc
      ORTHANC_HTTP_PORT: "8042"
    command: ["python", "-m", "transducin.api"]
    depends_on:
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  transducin-watcher:
    image: transducin:${TRANSDUCIN_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: transducin-watcher
    restart: unless-stopped
    env_file: .env
    environment:
      ORTHANC_HOST: orthanc
      ORTHANC_PORT: "4242"
    volumes:
      - ./input:/data/input:ro        # OCT files dropped here (read-only)
      - ./output:/data/output         # Generated DICOM SRs
      - ./logs:/var/log/transducin
    command:
      - "--watch"
      - "/data/input"
      - "--output"
      - "/data/output"
      - "--logs"
      - "/var/log/transducin"
      - "--orthanc-host"
      - "orthanc"
      - "--orthanc-port"
      - "4242"
      - "--process-existing"
    depends_on:
      orthanc:
        condition: service_healthy

volumes:
  orthanc-data:
