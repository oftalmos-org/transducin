# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transducin"
version = "1.0.0"
description = "Pipeline multivendor OCT → DICOM + SR TID 1500 + C-STORE para RetinaOS."
readme = "README.md"
authors = [{ name = "Noel Jaurrieta", email = "noel@oftalmos.org" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = ["oct", "dicom", "ophthalmology", "retina", "revo", "cirrus", "orthanc"]
dependencies = [
    # Transducin core
    "pydicom>=3.0.1",
    "highdicom>=0.27.0",
    "numpy>=1.24.0",
    "pynetdicom>=2.0.0",
    "watchdog>=3.0.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "psutil>=5.9.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/oftalmos-org/transducin"

[tool.setuptools.packages.find]
where = [""]
include = ["transducin*"]
exclude= ["my_example_volumes*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",  # imports after load_dotenv() — intentional pattern throughout
]

[tool.bumpver]
current_version = "1.0.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
