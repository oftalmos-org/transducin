name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check transducin/ tests/
      - run: ruff format --check transducin/ tests/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydicom>=3.0.1 highdicom>=0.27.0 numpy>=1.24.0 pynetdicom>=2.0.0 \
            watchdog>=3.0.0 Pillow>=10.0.0 pdfplumber>=0.10.0 pytesseract>=0.3.10 \
            psutil>=5.9.0 construct>=2.10 fastapi>=0.111.0 uvicorn>=0.29.0 httpx>=0.27.0 asyncpg>=0.29.0 \
            pytest pytest-asyncio
          # pdf2image requires poppler; skip in CI or install:
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install pdf2image>=1.17.0
      - name: Install transducin (editable)
        run: pip install -e . --no-deps
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t transducin:ci-test .
